name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install uv==0.8.4
          uv sync --frozen --extra dev
      - name: Lint (ruff)
        run: uv run --frozen ruff check hebbrix_mcp/ tests/
      - name: Compile check
        run: uv run --frozen python -m py_compile hebbrix_mcp/server.py hebbrix_mcp/__init__.py
      - name: Import contract (warnings are errors)
        run: uv run --frozen python -W error -c "import hebbrix_mcp.server"
      - name: Tests (offline — no network, no key)
        run: uv run --frozen pytest tests/ -q -W error

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install locked audit environment
        run: |
          python -m pip install uv==0.8.4
          uv sync --frozen --extra dev
      - name: Dependency vulnerability audit
        run: uv run --frozen pip-audit
      - name: Static security analysis (medium/high)
        run: uv run --frozen bandit -q -ll -r hebbrix_mcp
